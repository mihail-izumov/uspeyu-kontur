name: Deploy to GitHub Pages

# Сборка и публикация на Pages при каждом пуше в main.
#
# ⚠ Данные приложения (public/data/health.json) собираются НЕ здесь, а на
#   машине владельца командой `python3 tools/build_app_data.py` в репозитории
#   контура, и приезжают сюда уже готовым файлом. Причина: сам контур
#   (мастера, tools/) в этот репозиторий не входит — публикуется только /app.
#   Значит, порядок перед пушем всегда один:
#       python3 tools/build_app_data.py  →  git add app/public/data  →  push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои отменяют друг друга: на Pages имеет смысл только
# последний, а очередь из трёх сборок задерживает его на минуты.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Проверить, что данные контура на месте
        # SYS-6 (Д-32): в репозитории лежит ТОЛЬКО шифрованный файл. Без него
        # сборка проходит, а приложение открывается пустым экраном — пусть
        # падает здесь и с внятной строкой.
        run: |
          test -s public/data/health.enc.json || {
            echo "::error::public/data/health.enc.json отсутствует или пуст."
            echo "::error::Выполните: python3 tools/build_app_data.py, затем KONTUR_PASS='фраза' npm run data:encrypt — и закоммитьте .enc."
            exit 1
          }

      - name: Расшифровать данные для дымовой проверки
        # Открытого health.json в репозитории нет (SYS-6). Дымовой проверке он
        # нужен — восстанавливаем из .enc секретом KONTUR_PASS (Settings →
        # Secrets and variables → Actions). Файл живёт только в раннере.
        # ⛔ Без секрета проверка границ не пройдёт — публикация остановится:
        # выкладывать непроверенное хуже, чем не выложить.
        env:
          KONTUR_PASS: ${{ secrets.KONTUR_PASS }}
        run: |
          test -n "$KONTUR_PASS" || {
            echo "::error::Секрет KONTUR_PASS не задан — дымовую проверку не на чем прогнать."
            exit 1
          }
          npm run data:decrypt

      - run: npm run build

      - name: Дымовая проверка и границы контура
        # Поднимает собранное приложение, проходит вход, открывает все разделы
        # и ищет на экранах формулировки, запрещённые docs/STANDARD-safety.md.
        # ⛔ Падение здесь останавливает публикацию: приложение, которое начало
        # советовать «снизь дозу», выкладывать нельзя, даже если оно собралось.
        env:
          KONTUR_PASS: ${{ secrets.KONTUR_PASS }}
        run: |
          node scripts/build-preview.mjs
          node scripts/smoke.mjs dist/preview.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
