name: Deploy to GitHub Pages

# Сборка и публикация на Pages при каждом пуше в main.
#
# ⚠ Данные приложения (public/data/health.json) собираются НЕ здесь, а на
#   машине владельца командой `python3 tools/build_app_data.py` в репозитории
#   контура, и приезжают сюда уже готовым файлом. Причина: сам контур
#   (мастера, tools/) в этот репозиторий не входит — публикуется только /app.
#   Значит, порядок перед пушем всегда один:
#       python3 tools/build_app_data.py  →  git add app/public/data  →  push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои отменяют друг друга: на Pages имеет смысл только
# последний, а очередь из трёх сборок задерживает его на минуты.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Проверить, что данные контура на месте
        # SYS-6 (Д-32): в репозитории лежит ТОЛЬКО шифрованный файл. Без него
        # сборка проходит, а приложение открывается пустым экраном — пусть
        # падает здесь и с внятной строкой.
        run: |
          test -s public/data/health.enc.json || {
            echo "::error::public/data/health.enc.json отсутствует или пуст."
            echo "::error::Выполните: python3 tools/build_app_data.py, затем KONTUR_PASS='фраза' npm run data:encrypt — и закоммитьте .enc."
            exit 1
          }

      - name: Расшифровать данные для дымовой проверки
        # Открытого health.json в репозитории нет (SYS-6). Проверкам за входом
        # он нужен — восстанавливаем из .enc секретом KONTUR_PASS (Settings →
        # Secrets and variables → Actions). Файл живёт только в раннере.
        #
        # ⚠ ЭТОТ ШАГ БОЛЬШЕ НЕ РОНЯЕТ ПУБЛИКАЦИЮ (Д-46, 30.08.2026).
        #   Раньше ронял: правило приёмки ТЗ-1 «выкладывать непроверенное хуже,
        #   чем не выложить». Тогда за репозиторием стояло только личное
        #   приложение владельца. С Д-45 тот же репозиторий держит ПУБЛИЧНУЮ
        #   страницу, и разъехавшийся секрет гасил её для всех, хотя к самой
        #   странице отношения не имеет. За один день это случилось трижды.
        #
        # ⛔ Граница при этом не ослабла. Главная проверка публикации — что до
        #   входа нет ни одного медицинского факта — идёт БЕЗ пароля: данные
        #   публичной страницы лежат в открытом public.json. Расшифровка нужна
        #   только экранам ЗА входом, а они видны одному человеку.
        continue-on-error: true
        id: decrypt
        env:
          KONTUR_PASS: ${{ secrets.KONTUR_PASS }}
        run: |
          test -n "$KONTUR_PASS" || {
            echo "::warning::Секрет KONTUR_PASS не задан — проверки за входом будут пропущены."
            exit 1
          }
          npm run data:decrypt

      - name: Сказать вслух, что проверки за входом пропущены
        if: steps.decrypt.outcome == 'failure'
        run: |
          echo "::warning::Данные не расшифрованы: секрет KONTUR_PASS не совпадает с фразой, которой собран health.enc.json."
          echo "::warning::Публичная страница проверена и опубликована. Экраны ЗА входом в этом прогоне НЕ проверялись."
          echo "::warning::Починить: Settings → Secrets → KONTUR_PASS, набрать фразу руками (вставка тащит кавычки и пробелы)."

      - run: npm run build

      - name: Дымовая проверка и границы контура
        # Поднимает собранное приложение и ищет запрещённое: на публичной
        # странице — медицинские факты из docs/PUBLIC-WHITELIST.md §2, на
        # экранах за входом — формулировки, запрещённые STANDARD-safety.md.
        # ⛔ Падение ЗДЕСЬ по-прежнему останавливает публикацию: приложение,
        # которое начало советовать «снизь дозу» или выложило медицину на
        # открытую страницу, публиковать нельзя, даже если оно собралось.
        #
        # ⚠ Без расшифровки дым сам пропустит вход и честно напишет об этом
        #   строкой «вход верным паролем — ПРОПУЩЕН»; раздел про публичную
        #   границу отработает полностью.
        env:
          KONTUR_PASS: ${{ secrets.KONTUR_PASS }}
        run: |
          node scripts/build-preview.mjs
          node scripts/smoke.mjs dist/preview.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
