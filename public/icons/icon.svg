<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Знак контура: кольцо, замкнутое не полностью.
       Сплошная дуга — то, что контур видит. Пунктирный сектор — то, чего у
       него нет: пробел существует и посчитан, он не «ничего». Внутри —
       кардиолиния, потому что первое, что приложение показывает, это
       нагрузка, а не диагноз. -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 88a168 168 0 1 1-118.8 286.8" stroke="#F2F2F2" stroke-width="26"/>
    <path d="M137.2 374.8A168 168 0 0 1 88 256" stroke="#5C5C5C" stroke-width="26" stroke-dasharray="6 46"/>
    <path d="M152 262h50l24-56 38 108 24-52h52" stroke="#F2F2F2" stroke-width="24"/>
  </g>
</svg>
